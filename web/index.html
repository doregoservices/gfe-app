<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GFE — Connexion</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#f4f1ec;color:#2b2118;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .carte{background:#fff;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.08);padding:32px;width:min(92vw,380px)}
  h1{margin:0 0 4px;font-size:20px;color:#4a2e1b} p.sous{margin:0 0 22px;color:#7a6a5c;font-size:14px}
  label{display:block;font-size:13px;margin:12px 0 4px;color:#4a2e1b}
  input{width:100%;padding:10px 12px;border:1px solid #d6cbbd;border-radius:8px;font-size:15px}
  button{margin-top:18px;width:100%;padding:11px;border:0;border-radius:8px;background:#6f4a2e;color:#fff;font-size:15px;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  .erreur{margin-top:12px;color:#a12f2f;font-size:14px;min-height:18px}
  .zone{display:none} .liste{margin:8px 0 0;padding:0;list-style:none} .liste li{padding:10px 12px;border:1px solid #e6dfd4;border-radius:8px;margin-top:8px}
  .lien{background:none;color:#6f4a2e;margin-top:14px;padding:0;width:auto;text-decoration:underline;font-size:13px}
</style>
</head>
<body>
<div class="carte">
  <div id="connexion">
    <h1>Global First Engineering</h1>
    <p class="sous">Connexion à votre espace</p>
    <form id="formulaire">
      <label for="email">Adresse e-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="mdp">Mot de passe</label>
      <input id="mdp" type="password" autocomplete="current-password" required>
      <button id="bouton" type="submit">Se connecter</button>
      <div class="erreur" id="erreur"></div>
    </form>
  </div>
  <div class="zone" id="espace">
    <h1>Mes entreprises</h1>
    <p class="sous" id="bienvenue"></p>
    <ul class="liste" id="liste"></ul>
    <button class="lien" id="deconnexion">Se déconnecter</button>
  </div>
</div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://ewcxndlelagtrlshadlj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3Y3huZGxlbGFndHJsc2hhZGxqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMjU4NzYsImV4cCI6MjEwMjgwMTg3Nn0.56ORPMKuu-RcbcqVTLuKC3gylOw5jQmXgIb1adXbjCg";

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { db: { schema: "gfe" } });
const $ = (id) => document.getElementById(id);

async function afficherEspace(session) {
  $("connexion").style.display = "none";
  $("espace").style.display = "block";
  $("bienvenue").textContent = "Connecté : " + (session.user.email || "");
  const { data, error } = await sb.from("entreprises").select("id, nom").order("nom");
  const liste = $("liste");
  liste.innerHTML = "";
  if (error) { liste.innerHTML = "<li>Erreur de chargement.</li>"; return; }
  if (!data.length) { liste.innerHTML = "<li>Aucune entreprise rattachée à votre compte.</li>"; return; }
  for (const e of data) {
    const li = document.createElement("li");
    li.textContent = e.nom;
    liste.appendChild(li);
  }
}

function afficherConnexion() {
  $("espace").style.display = "none";
  $("connexion").style.display = "block";
}

$("formulaire").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("erreur").textContent = "";
  $("bouton").disabled = true;
  const { data, error } = await sb.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("mdp").value,
  });
  $("bouton").disabled = false;
  if (error) { $("erreur").textContent = "E-mail ou mot de passe incorrect."; return; }
  $("mdp").value = "";
  afficherEspace(data.session);
});

$("deconnexion").addEventListener("click", async () => {
  await sb.auth.signOut();
  afficherConnexion();
});

sb.auth.getSession().then(({ data }) => {
  if (data.session) afficherEspace(data.session); else afficherConnexion();
});
</script>
</body>
</html>
