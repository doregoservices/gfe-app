<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GFE — Paie et RH : aide et calculs</title>
</head>
<body>
<header class="bandeau">
  <img src="charte/logo_banniere.png" alt="GFE" onerror="this.style.display='none'">
  <div class="titre">PAIE ET RH : AIDE ET CALCULS</div>
  <div class="droite"><span id="qui"></span><a class="bouton" href="gestion.html">← GESTION</a><button id="deco">Déconnexion</button></div>
</header>
<main id="principal"><p class="petit">Chargement…</p></main>
<script type="module">
import { sb, $, esc, F, num, txt, formulaireConnexion, injecterStyle } from "./assets/stock-core.js";
injecterStyle();

const BRANCHE = { commerce: "Commerce, distribution, négoce et professions libérales", btp: "Bâtiment, travaux publics et activités connexes", industrie: "Industrie mécanique, alimentaire, corps gras, chimique et transport", transit: "Auxiliaires du transport et transit", securite: "Sécurité privée" };
const nomBranche = (b) => BRANCHE[b] || b;
const CATEGORIE_PREAVIS = { "cat1_5": "Catégorie 1 à 5 (ouvriers, employés, agents de maîtrise, techniciens)", "cat6": "Catégorie 6 et plus (cadres)" };
const MODE_PAIE = { "heure": "Payé à l'heure ou à la journée", "mois": "Payé au mois" };

const AIDE = `
<section class="bloc">
  <h2>Comprendre les termes</h2>
  <table>
    <tr><th>Terme</th><th>Ce que cela veut dire</th></tr>
    <tr><td><b>Catégorie</b></td><td>Niveau du salarié dans la convention collective (1re à 6e et plus). Elle fixe son salaire minimum (« minimum conventionnel ») et, pour le préavis, le groupe 1 à 5 ou le groupe 6 et plus.</td></tr>
    <tr><td><b>Minimum conventionnel</b></td><td>Le salaire minimum mensuel prévu par la convention collective pour la catégorie. Il sert de base à la gratification. Il doit être saisi d'après la grille officielle (voir le tableau des catégories).</td></tr>
    <tr><td><b>Mode de paie</b></td><td>« À l'heure ou à la journée » ou « au mois ». Il change la durée du préavis.</td></tr>
    <tr><td><b>Ancienneté</b></td><td>Temps de service continu dans l'entreprise, compté depuis la date d'embauche jusqu'à la date de fin.</td></tr>
    <tr><td><b>Prorata</b></td><td>Calcul au temps réellement travaillé dans l'année (embauche, démission ou licenciement en cours d'année). Exemple : 6 mois sur 12 donnent la moitié.</td></tr>
    <tr><td><b>Gratification de fin d'année</b></td><td>Le « 13e mois » minimum : 3/4 du minimum conventionnel de la catégorie, versé en fin d'année, au prorata (convention collective 1977, art. 53).</td></tr>
    <tr><td><b>Préavis</b></td><td>Délai à respecter avant qu'une rupture de contrat prenne effet. Sa durée dépend du mode de paie, de la catégorie et de l'ancienneté (décret n° 2026-198).</td></tr>
    <tr><td><b>Incapacité de plus de 40 %</b></td><td>Lorsque le salarié a une incapacité permanente de plus de 40 %, le délai après 6 mois d'ancienneté est doublé.</td></tr>
    <tr><td><b>Licenciement abusif</b></td><td>Licenciement sans motif légitime, ou pour faux motif. Il donne droit à des dommages-intérêts (Code du travail, art. 18.15). <b>L'outil calcule le montant ; c'est le juge qui décide si le licenciement est abusif.</b></td></tr>
    <tr><td><b>Dommages-intérêts</b></td><td>1 mois de salaire brut par année d'ancienneté, avec un minimum de 3 mois et un maximum de 20 mois de salaire brut.</td></tr>
    <tr><td><b>Salaire brut moyen</b></td><td>Moyenne mensuelle du salaire brut sur les 12 derniers mois de service (ou moins si l'ancienneté est plus courte).</td></tr>
  </table>
  <p class="petit">Les taux et seuils sont enregistrés dans la base (tables <code>rh_categories</code>, <code>rh_reglages</code>, <code>rh_bareme_preavis</code>) et peuvent être modifiés sans changer le programme. Sources et points à valider : <code>docs/PAIE_RH_regles_a_valider.md</code>.</p>
</section>`;

const FORM_CALCULS = `
<section class="bloc">
  <h2>1. Gratification de fin d'année</h2>
  <p class="petit">Montant minimum = 3/4 × minimum conventionnel de la catégorie × jours de service dans l'année ÷ 365. Si une prime déjà versée est au moins égale à ce minimum, rien de plus n'est dû.</p>
  <div class="ligne">
    <label>Branche (convention) <select id="g_branche"></select></label>
    <label>Catégorie <select id="g_cat"></select></label>
    <label>Année <input id="g_annee" type="number" value="${new Date().getFullYear()}"></label>
    <label>Date d'entrée <input id="g_entree" type="date" value="${new Date().getFullYear()}-01-01"></label>
    <label>Date de sortie (si partie) <input id="g_sortie" type="date"></label>
    <label>Déjà versé dans l'année <input id="g_deja" type="number" value="0"></label>
    <button id="g_go">Calculer</button>
  </div>
  <div id="g_res"></div>
</section>

<section class="bloc">
  <h2>2. Dommages-intérêts en cas de licenciement abusif</h2>
  <p class="petit">1 mois de salaire brut par année d'ancienneté, minimum 3 mois, maximum 20 mois (art. 18.15, b). Ce calcul suppose que le licenciement a été jugé abusif.</p>
  <div class="ligne">
    <label>Salaire brut mensuel moyen (F) <input id="a_salaire" type="number"></label>
    <label>Ancienneté en années complètes <input id="a_annees" type="number" min="0" value="0"></label>
    <button id="a_go">Calculer</button>
  </div>
  <div id="a_res"></div>
</section>

<section class="bloc">
  <h2>3. Durée du préavis</h2>
  <p class="petit">Décret n° 2026-198. Le barème est dans la base ; seule la durée est calculée ici.</p>
  <div class="ligne">
    <label>Mode de paie <select id="p_mode"></select></label>
    <label>Catégorie <select id="p_cat"></select></label>
    <label>Ancienneté en mois <input id="p_mois" type="number" min="0" value="0"></label>
    <label><input id="p_incap" type="checkbox"> Incapacité de plus de 40 %</label>
    <button id="p_go">Calculer</button>
  </div>
  <div id="p_res"></div>
</section>`;


const SALARIES_HTML = `
<section class="bloc">
  <h2>4. Salariés, gratification, préavis et bulletins</h2>
  <p class="petit">Choisissez une entreprise. Pour chaque salarié, l'outil calcule automatiquement la gratification de l'année, le préavis et les dommages-intérêts (à la date du jour), et le bulletin du mois.</p>
  <div class="ligne"><label>Entreprise <select id="s_ent"></select></label></div>
  <div id="s_liste"></div>
</section>
<section class="bloc">
  <h2>5. Bulletins du mois (alimentent le journal de paie PA)</h2>
  <p class="petit">Génère un bulletin par salarié payé au mois pour l'entreprise choisie. Les écritures (9 lignes par bulletin) apparaissent dans le journal PA de la Comptabilité. Relancer le calcul remplace les bulletins du mois.</p>
  <div class="ligne"><label>Mois <input id="b_mois" type="month"></label><button id="b_go">Générer les bulletins du mois</button></div>
  <div id="b_res"></div>
</section>
<section class="bloc">
  <h2>Ajouter un salarié</h2>
  <div class="ligne">
    <label>Nom <input id="n_nom"></label>
    <label>Fonction <input id="n_fonction"></label>
    <label>Branche <select id="n_branche"></select></label>
    <label>Catégorie <select id="n_cat"></select></label>
    <label>Date d'entrée <input id="n_entree" type="date"></label>
    <label>Mode de paie <select id="n_mode"></select></label>
    <label>Groupe préavis <select id="n_groupe"></select></label>
    <label>Salaire de base (F/mois) <input id="n_salaire" type="number"></label>
    <label>Salaire moyen des 12 derniers mois (F, facultatif) <input id="n_moyen" type="number"></label>
    <label>Transport (F/mois) <input id="n_transport" type="number" value="0"></label>
    <label>Personnes couvertes CMU <input id="n_cmu" type="number" value="0"></label>
    <label>Parts fiscales <input id="n_parts" type="number" step="0.5" value="1"></label>
    <button id="n_go">Enregistrer le salarié</button>
  </div>
  <div id="n_res"></div>
  <table>
    <tr><th>Champ</th><th>Ce qu'il faut saisir</th></tr>
    <tr><td>Catégorie</td><td>Le niveau du salarié dans la grille de sa branche (voir le tableau des catégories). Elle fixe le minimum de la gratification.</td></tr>
    <tr><td>Mode de paie</td><td>« À l'heure ou à la journée » ou « au mois » (change la durée du préavis).</td></tr>
    <tr><td>Groupe préavis</td><td>« 1 à 5 » pour les catégories 1 à 5, « 6 et plus » pour les cadres.</td></tr>
    <tr><td>Parts fiscales</td><td>1 pour un célibataire, 2 pour un marié, +0,5 par enfant à charge (5 parts au maximum).</td></tr>
    <tr><td>Personnes couvertes CMU</td><td>Nombre de personnes couvertes. 1 000 F par personne et par mois, moitié salarié, moitié employeur.</td></tr>
    <tr><td>Salaire moyen des 12 derniers mois</td><td>Moyenne mensuelle du salaire brut sur les 12 derniers mois. Sert au calcul des dommages-intérêts et de l'indemnité de licenciement. Si vide, le salaire de base est utilisé.</td></tr>
    <tr><td>Indemnité de licenciement</td><td>30 % du salaire moyen par année jusqu'à la 5e, 35 % de la 6e à la 10e, 40 % au-delà (décret 2017-210). Due après 12 mois de service continu, sauf faute lourde.</td></tr>
    <tr><td>Transport</td><td>Indemnité de transport mensuelle, ajoutée au net et au coût employeur, hors ITS.</td></tr>
  </table>
</section>`;

async function demarrer() {
  const { data } = await sb.auth.getSession();
  if (!data.session) { formulaireConnexion($("principal"), demarrer); return; }
  $("qui").textContent = data.session.user.email;
  $("deco").onclick = async () => { await sb.auth.signOut(); location.reload(); };
  const profil = await sb.from("profils").select("role,bloque").eq("id", data.session.user.id);
  const role = profil.data && profil.data[0] ? profil.data[0].role : null;
  if (!["chef_cabinet", "chef_comptable", "comptable"].includes(role) || (profil.data[0] && profil.data[0].bloque)) {
    $("principal").innerHTML = '<div class="msg ko">La paie et les RH sont réservées aux comptables et aux chefs du cabinet.</div>'; return;
  }
  $("principal").innerHTML = AIDE + `<section class="bloc"><h2>Catégories conventionnelles</h2><div id="cats"><p class="petit">Chargement…</p></div></section>` + FORM_CALCULS + SALARIES_HTML;
  remplirChoix();
  chargerCategories().then(chargerEntreprises);
  $("g_go").onclick = calculerGratification;
  $("a_go").onclick = calculerAbus;
  $("p_go").onclick = calculerPreavis;
}

const ETAT = { categories: [] };
function remplirCategories() {
  const b = $("g_branche").value;
  $("g_cat").innerHTML = ETAT.categories.filter((c) => c.branche === b)
    .map((c) => `<option value="${esc(c.categorie)}">${esc(c.categorie)} : ${esc(c.libelle)}</option>`).join("");
}

function remplirChoix() {
  $("p_mode").innerHTML = Object.entries(MODE_PAIE).map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join("");
  $("p_cat").innerHTML = Object.entries(CATEGORIE_PREAVIS).map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join("");
}

async function chargerCategories() {
  const { data, error } = await sb.from("rh_categories").select("branche,categorie,ordre,libelle,famille,minimum_conventionnel,source,explication").order("branche").order("ordre");
  if (error) { $("cats").innerHTML = `<div class="msg ko">${esc(error.message)}</div>`; return; }
  const branches = [...new Set(data.map((c) => c.branche))];
  $("g_branche").innerHTML = branches.map((b) => `<option value="${esc(b)}">${esc(nomBranche(b))}</option>`).join("");
  $("g_branche").onchange = remplirCategories;
  ETAT.categories = data;
  remplirCategories();
  $("cats").innerHTML = `
    <p class="petit">Chaque branche a sa propre grille. Le minimum est saisi d'après le texte de la convention de la branche. Une catégorie sans minimum bloque le calcul de la gratification tant qu'il n'est pas renseigné.</p>
    <table><tr><th>Branche</th><th>Catégorie</th><th>Intitulé</th><th>Famille</th><th>Minimum (F/mois)</th><th>Source</th></tr>
    ${data.map((c) => `<tr><td>${esc(nomBranche(c.branche))}</td><td>${esc(c.categorie)}</td><td>${esc(c.libelle)}</td><td>${esc(c.famille || "")}</td><td>${c.minimum_conventionnel === null ? '<span class="ko">Non renseigné</span>' : F(c.minimum_conventionnel)}</td><td>${esc(c.source || "")}</td></tr>`).join("")}
    </table>`;
}

// Affiche un résultat ou l'erreur renvoyée par la base.
function afficher(id, erreur, html) {
  $(id).innerHTML = erreur ? `<div class="msg ko">${esc(erreur.message)}</div>` : html;
}

async function calculerGratification() {
  const { data, error } = await sb.rpc("gratification_minimum", {
    p_branche: $("g_branche").value,
    p_categorie: $("g_cat").value,
    p_annee: num($("g_annee").value),
    p_date_entree: $("g_entree").value,
    p_date_sortie: txt($("g_sortie").value),
  });
  if (error) return afficher("g_res", error);
  const deja = num($("g_deja").value) || 0;
  const reste = Math.max(0, data - deja);
  afficher("g_res", null, `<div class="msg ok"><b>Minimum dû : ${F(data)} F</b><br>Déjà versé : ${F(deja)} F<br><b>Complément à verser : ${F(reste)} F</b></div>`);
}

async function calculerAbus() {
  const { data, error } = await sb.rpc("dommages_licenciement_abusif", {
    p_salaire_brut_moyen: num($("a_salaire").value),
    p_anciennete_annees: num($("a_annees").value) || 0,
  });
  if (error) return afficher("a_res", error);
  const r = data[0];
  afficher("a_res", null, `<div class="msg ok"><b>Dommages-intérêts : ${F(r.montant)} F</b><br>Mois retenus : ${Number(r.mois_retenus)} (minimum 3, maximum 20)</div>`);
}

async function calculerPreavis() {
  const { data, error } = await sb.rpc("duree_preavis", {
    p_mode: $("p_mode").value,
    p_categorie: $("p_cat").value,
    p_anciennete_mois: num($("p_mois").value) || 0,
    p_incapacite: $("p_incap").checked,
  });
  if (error) return afficher("p_res", error);
  const r = data[0];
  afficher("p_res", null, `<div class="msg ok"><b>Préavis : ${Number(r.duree)} ${r.unite === "jours" ? "jour(s)" : "mois"}</b></div>`);
}

function formatSal(v) { return v === null || v === undefined ? "" : F(v); }

async function chargerEntreprises() {
  const { data, error } = await sb.from("entreprises").select("id,nom").order("nom");
  if (error) { $("s_liste").innerHTML = `<div class="msg ko">${esc(error.message)}</div>`; return; }
  $("s_ent").innerHTML = data.map((e) => `<option value="${esc(e.id)}">${esc(e.nom)}</option>`).join("");
  $("s_ent").onchange = chargerSalaries;
  $("n_mode").innerHTML = Object.entries(MODE_PAIE).map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join("");
  $("n_groupe").innerHTML = Object.entries(CATEGORIE_PREAVIS).map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join("");
  const branches = [...new Set(ETAT.categories.map((c) => c.branche))];
  $("n_branche").innerHTML = branches.map((b) => `<option value="${esc(b)}">${esc(nomBranche(b))}</option>`).join("");
  $("n_branche").onchange = remplirCategoriesSalarie;
  remplirCategoriesSalarie();
  $("n_go").onclick = enregistrerSalarie;
  $("b_mois").value = aujourdhui().slice(0, 7);
  $("b_go").onclick = genererBulletins;
  chargerSalaries();
}

function remplirCategoriesSalarie() {
  const b = $("n_branche").value;
  $("n_cat").innerHTML = ETAT.categories.filter((c) => c.branche === b)
    .map((c) => `<option value="${esc(c.categorie)}">${esc(c.categorie)} : ${esc(c.libelle)}</option>`).join("");
}

async function genererBulletins() {
  const eid = $("s_ent").value;
  const mois = $("b_mois").value;
  if (!eid || !mois) { $("b_res").innerHTML = '<div class="msg ko">Choisissez une entreprise et un mois.</div>'; return; }
  const debut = mois + "-01";
  const fin = new Date(Number(mois.slice(0, 4)), Number(mois.slice(5, 7)), 0).toISOString().slice(0, 10);
  const { data: n, error } = await sb.rpc("generer_bulletins", { p_entreprise: eid, p_mois: debut });
  if (error) { $("b_res").innerHTML = `<div class="msg ko">${esc(error.message)}</div>`; return; }
  const { data, error: e2 } = await sb.from("bulletins_paie").select("*, salaries(nom)").eq("entreprise_id", eid)
    .gte("periode", debut).lte("periode", fin).order("periode");
  if (e2) { $("b_res").innerHTML = `<div class="msg ko">${esc(e2.message)}</div>`; return; }
  const lignes = data.map((b) => `<tr>
      <td>${esc(b.salaries ? b.salaries.nom : "")}</td>
      <td>${F(b.brut)} F</td><td>${F(b.transport)} F</td><td>${F(b.cnps_salarie + b.cmu_salarie)} F</td>
      <td>${F(b.its_net)} F</td>
      <td>${b.net_a_payer < 0 ? `<span class="ko">${F(b.net_a_payer)} F (négatif : vérifier la saisie)</span>` : `<b>${F(b.net_a_payer)} F</b>`}</td>
      <td>${F(b.cout_employeur)} F</td></tr>`).join("");
  $("b_res").innerHTML = `<div class="msg ok">${Number(n)} bulletin(s) généré(s) pour ${esc(mois)}.</div>` +
    (data.length ? `<table><tr><th>Salarié</th><th>Brut</th><th>Transport</th><th>Retenues salarié (CNPS + CMU)</th><th>ITS net</th><th>Net à payer</th><th>Coût employeur</th></tr>${lignes}</table>` : "");
}

async function enregistrerSalarie() {
  const ligne = {
    entreprise_id: $("s_ent").value,
    nom: txt($("n_nom").value),
    fonction: txt($("n_fonction").value),
    branche: $("n_branche").value,
    categorie: $("n_cat").value,
    date_entree: txt($("n_entree").value),
    mode_paie: $("n_mode").value,
    groupe_preavis: $("n_groupe").value,
    salaire_base: num($("n_salaire").value),
    salaire_moyen_12_mois: num($("n_moyen").value),
    transport: num($("n_transport").value) || 0,
    personnes_cmu: num($("n_cmu").value) || 0,
    parts: num($("n_parts").value) || 1,
  };
  if (!ligne.nom || !ligne.date_entree || ligne.salaire_base === null) {
    $("n_res").innerHTML = '<div class="msg ko">Nom, date d\'entrée et salaire de base sont obligatoires.</div>'; return;
  }
  const { error } = await sb.from("salaries").insert(ligne);
  if (error) { $("n_res").innerHTML = `<div class="msg ko">${esc(error.message)}</div>`; return; }
  $("n_res").innerHTML = '<div class="msg ok">Salarié enregistré.</div>';
  chargerSalaries();
}

async function chargerSalaries() {
  const eid = $("s_ent").value;
  if (!eid) { $("s_liste").innerHTML = '<p class="petit">Aucune entreprise.</p>'; return; }
  const { data, error } = await sb.from("salaries").select("*").eq("entreprise_id", eid).order("nom");
  if (error) { $("s_liste").innerHTML = `<div class="msg ko">${esc(error.message)}</div>`; return; }
  if (!data.length) { $("s_liste").innerHTML = '<p class="petit">Aucun salarié pour cette entreprise.</p>'; return; }
  const aujourdui = aujourdhui();
  const annee = Number(aujourdui.slice(0, 4));
  const lignes = await Promise.all(data.map(async (s) => {
    const [g, p, d, ind, b] = await Promise.all([
      sb.rpc("gratification_salarie", { p_salarie: s.id, p_annee: annee }),
      sb.rpc("preavis_salarie", { p_salarie: s.id, p_date_rupture: aujourdui, p_incapacite: false }),
      sb.rpc("dommages_salarie", { p_salarie: s.id, p_date_rupture: aujourdui }),
      sb.rpc("indemnite_licenciement_salarie", { p_salarie: s.id, p_date_rupture: aujourdui, p_faute_lourde: false }),
      sb.rpc("bulletin_paie", { p_brut: s.salaire_base, p_transport: s.transport, p_cmu_personnes: s.personnes_cmu, p_parts: s.parts }),
    ]);
    const cell = (r, f) => r.error ? `<span class="ko">${esc(r.error.message)}</span>` : f(r.data);
    return `<tr>
      <td>${esc(s.nom)}<br><span class="petit">${esc(s.fonction || "")}</span></td>
      <td>${esc(nomBranche(s.branche))}<br>Catégorie ${esc(s.categorie)}</td>
      <td>${esc(s.date_entree)}</td>
      <td>${F(s.salaire_base)} F${s.transport ? " + transport " + F(s.transport) : ""}</td>
      <td>${cell(g, (v) => F(v) + " F")}</td>
      <td>${cell(p, (v) => { const r = v[0]; return r ? `${Number(r.duree)} ${r.unite === "jours" ? "jour(s)" : "mois"}` : ""; })}</td>
      <td>${cell(d, (v) => { const r = v[0]; return r ? `${F(r.montant)} F (${Number(r.mois_retenus)} mois)` : ""; })}</td>
      <td>${cell(ind, (v) => { const r = v[0]; return r ? (r.eligible ? `${F(r.montant)} F (${r.anciennete_mois} mois)` : `Non due (ancienneté ${r.anciennete_mois} mois)`) : ""; })}</td>
      <td>${cell(b, (v) => { const r = v[0]; return r ? `Brut ${F(r.brut)}<br>CNPS salarié ${F(r.cnps_salarie)}<br>CMU salarié ${F(r.cmu_salarie)}<br>ITS net ${F(r.its_net)}<br><b>Net à payer ${F(r.net_a_payer)} F</b><br>Coût employeur ${F(r.cout_employeur)} F` : ""; })}</td>
    </tr>`;
  }));
  $("s_liste").innerHTML = `<table>
    <tr><th>Salarié</th><th>Branche</th><th>Entrée</th><th>Salaire</th><th>Gratification ${annee}</th><th>Préavis (aujourd'hui)</th><th>Dommages si abusif (aujourd'hui)</th><th>Indemnité de licenciement (aujourd'hui)</th><th>Bulletin du mois</th></tr>
    ${lignes.join("")}</table>
    <p class="petit">Dommages-intérêts et indemnité calculés sur le salaire moyen des 12 derniers mois s'il est saisi, sinon sur le salaire de base.</p>`;
}

demarrer();
</script>
